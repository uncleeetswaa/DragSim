<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Drag Racing Sim 3D preview</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:monospace;color:#fff;touch-action:none}
#hud{position:absolute;left:12px;top:10px;font-size:16px;text-shadow:0 0 6px #000;pointer-events:none}
#hint{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:15px;text-shadow:0 0 6px #000;pointer-events:none}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="hud">3D PREVIEW  |  <span id="spd">0</span> mph  |  view: <span id="vw">cockpit</span></div>
<div id="hint">Tap the top of the screen to change view. Slide up on the right to accelerate.</div>
<script type="module">
import * as THREE from 'three';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xe98a5a,60,420);

// ---- Sunset sky: a big sphere with a vertical gradient ----
{
 const c=document.createElement('canvas');c.width=16;c.height=256;
 const x=c.getContext('2d');
 const gr=x.createLinearGradient(0,0,0,256);
 gr.addColorStop(0,'#0b1233');gr.addColorStop(0.5,'#6a3a6e');gr.addColorStop(0.8,'#ff8a4a');gr.addColorStop(1,'#ffd08a');
 x.fillStyle=gr;x.fillRect(0,0,16,256);
 const tex=new THREE.CanvasTexture(c);
 const sky=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide,fog:false}));
 scene.add(sky);
}

// ---- Lights ----
scene.add(new THREE.HemisphereLight(0xffb27a,0x20202a,0.9));
const sun=new THREE.DirectionalLight(0xffc48a,2.2);
sun.position.set(-60,40,-120);
sun.castShadow=true;
scene.add(sun);

// ---- Road with a wet look ----
const roadW=14;
const roadMat=new THREE.MeshStandardMaterial({color:0x2a2a30,roughness:0.28,metalness:0.4});
const road=new THREE.Mesh(new THREE.PlaneGeometry(roadW,2000),roadMat);
road.rotation.x=-Math.PI/2;road.position.z=-900;road.receiveShadow=true;
scene.add(road);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshStandardMaterial({color:0x1a1820,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.set(0,-0.05,-900);
scene.add(ground);

// lane dashes and edge lines: we move these to fake forward motion
const dashes=[];
const dashMat=new THREE.MeshBasicMaterial({color:0xeeeeee});
for(let i=0;i<60;i++){
 const d=new THREE.Mesh(new THREE.PlaneGeometry(0.25,3),dashMat);
 d.rotation.x=-Math.PI/2;d.position.set(0,0.02,-i*8);
 scene.add(d);dashes.push(d);
}
for(const sx of[-1,1]){
 const e=new THREE.Mesh(new THREE.PlaneGeometry(0.2,2000),dashMat);
 e.rotation.x=-Math.PI/2;e.position.set(sx*(roadW/2-0.3),0.02,-900);scene.add(e);
}

// ---- Lamp posts with glowing heads, they scroll past ----
const lamps=[];
for(let i=0;i<24;i++){
 for(const sx of[-1,1]){
  const grp=new THREE.Group();
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.1,7,8),new THREE.MeshStandardMaterial({color:0x222222}));
  pole.position.y=3.5;grp.add(pole);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.35,12,12),new THREE.MeshBasicMaterial({color:0xffd28a}));
  head.position.set(-sx*0.6,7,0);grp.add(head);
  const pl=new THREE.PointLight(0xffc27a,6,22,2);pl.position.set(-sx*0.6,6.8,0);grp.add(pl);
  grp.position.set(sx*(roadW/2+1.2),0,-i*30);
  scene.add(grp);lamps.push(grp);
 }
}

// ---- A glossy car built from shapes ----
function buildCar(color){
 const car=new THREE.Group();
 const paint=new THREE.MeshPhysicalMaterial({color,metalness:0.7,roughness:0.18,clearcoat:1,clearcoatRoughness:0.05});
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.55,4.3),paint);
 body.position.y=0.55;body.castShadow=true;car.add(body);
 const nose=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.3,1.2),paint);
 nose.position.set(0,0.48,-2.5);car.add(nose);
 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.5,2.0),new THREE.MeshPhysicalMaterial({color:0x10151c,metalness:0.2,roughness:0.05,clearcoat:1}));
 cabin.position.set(0,1.05,0.25);car.add(cabin);
 const wing=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.07,0.45),new THREE.MeshStandardMaterial({color:0x111111}));
 wing.position.set(0,1.1,2.0);car.add(wing);
 const tyreGeo=new THREE.CylinderGeometry(0.38,0.38,0.3,24);
 const tyreMat=new THREE.MeshStandardMaterial({color:0x0a0a0a,roughness:0.9});
 const rimMat=new THREE.MeshStandardMaterial({color:0xb8b8c0,metalness:1,roughness:0.2});
 car.userData.wheels=[];
 for(const [x,z] of[[-1,-1.4],[1,-1.4],[-1,1.4],[1,1.4]]){
  const w=new THREE.Group();
  const t=new THREE.Mesh(tyreGeo,tyreMat);t.rotation.z=Math.PI/2;w.add(t);
  const r=new THREE.Mesh(new THREE.CylinderGeometry(0.24,0.24,0.32,16),rimMat);r.rotation.z=Math.PI/2;w.add(r);
  w.position.set(x*0.98,0.38,z);car.add(w);car.userData.wheels.push(w);
 }
 // lights
 const tailMat=new THREE.MeshBasicMaterial({color:0xff2020});
 for(const sx of[-1,1]){
  const tl=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.14,0.05),tailMat);tl.position.set(sx*0.62,0.7,2.16);car.add(tl);
  const hl=new THREE.Mesh(new THREE.BoxGeometry(0.45,0.12,0.05),new THREE.MeshBasicMaterial({color:0xfffbe0}));hl.position.set(sx*0.65,0.58,-3.1);car.add(hl);
 }
 const tailGlow=new THREE.PointLight(0xff2020,2,6);tailGlow.position.set(0,0.7,2.6);car.add(tailGlow);
 const head=new THREE.SpotLight(0xfff2d0,60,60,0.5,0.6);head.position.set(0,0.6,-3);head.target.position.set(0,0,-30);car.add(head);car.add(head.target);
 return car;
}
const myCar=buildCar(0xe8b820); // gold, like the Godzilla
myCar.position.set(3.2,0,0);
scene.add(myCar);

// a rival car in the other lane
const rival=buildCar(0x14306a);
rival.position.set(-3.2,0,-6);
scene.add(rival);

// ---- Camera views ----
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1500);
let view=0;const names=['cockpit','chase','front quarter'];
function placeCamera(){
 if(view===0){cam.position.set(myCar.position.x-0.4,1.15,myCar.position.z-0.2);cam.lookAt(myCar.position.x-0.4,1.0,myCar.position.z-30)}
 else if(view===1){cam.position.set(myCar.position.x,2.8,myCar.position.z+8.5);cam.lookAt(myCar.position.x,0.9,myCar.position.z-6)}
 else{cam.position.set(myCar.position.x-4.6,0.9,myCar.position.z-4.5);cam.lookAt(myCar.position.x,0.6,myCar.position.z)}
 document.getElementById('vw').textContent=names[view];
}
placeCamera();

// ---- Input: tap the top to change view, slide on the right for throttle ----
let thr=0,tid=null,y0=0;
addEventListener('touchstart',e=>{
 e.preventDefault();
 for(const t of e.changedTouches){
  if(t.clientY<innerHeight*0.2){view=(view+1)%3;placeCamera();continue}
  if(t.clientX>innerWidth*0.35&&tid===null){tid=t.identifier;y0=t.clientY;thr=0.3}
 }
},{passive:false});
addEventListener('touchmove',e=>{
 e.preventDefault();
 for(const t of e.changedTouches)if(t.identifier===tid)thr=Math.max(0.3,Math.min(1,0.3+(y0-t.clientY)/(innerHeight*0.4)));
},{passive:false});
const endT=e=>{for(const t of e.changedTouches)if(t.identifier===tid){tid=null;thr=0}};
addEventListener('touchend',endT);addEventListener('touchcancel',endT);
addEventListener('keydown',e=>{if(e.key==='w'||e.key===' ')thr=1;if(e.key==='c'){view=(view+1)%3;placeCamera()}});
addEventListener('keyup',e=>{if(e.key==='w'||e.key===' ')thr=0});
addEventListener('click',e=>{if(e.clientY<innerHeight*0.2){view=(view+1)%3;placeCamera()}});

addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});

// ---- Loop: the car stays put in the world and the world scrolls past ----
let v=0,last=performance.now(),dist=0;
function loop(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 // simple acceleration with drag so it builds speed like a real launch
 const a=thr*(v<20?14:v<45?9:v<70?5:2.5)-0.012*v;
 v=Math.max(0,v+a*dt);
 dist+=v*dt;
 // scroll the road dashes and lamps toward the camera
 dashes.forEach(d=>{d.position.z+=v*dt;if(d.position.z>10)d.position.z-=480});
 lamps.forEach(l=>{l.position.z+=v*dt;if(l.position.z>20)l.position.z-=720});
 // rival keeps pace a hair behind
 rival.position.z=-6+Math.sin(dist*0.02)*0.2-Math.min(2,v*0.02)*-1;
 // wheels spin
 [myCar,rival].forEach(c=>c.userData.wheels.forEach(w=>w.rotation.x-=v*dt/0.38));
 // inertia: the car squats and the camera leans back under hard acceleration
 const squat=Math.max(-0.02,Math.min(0.05,a*0.004));
 myCar.rotation.x=squat;
 placeCamera();
 if(view===0)cam.position.y-=squat*6;
 if(view===0)cam.rotation.x+=squat*2;
 // slight shake at speed
 if(v>25){cam.position.x+=(Math.random()-0.5)*0.004*thr;cam.position.y+=(Math.random()-0.5)*0.004*thr}
 document.getElementById('spd').textContent=Math.round(v*2.237);
 renderer.render(scene,cam);
 requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
