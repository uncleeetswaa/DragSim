<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drag Racing Sim</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:monospace;color:#fff}
canvas{display:block;width:100vw;height:100vh}
#menu{position:absolute;inset:0;background:#111e;padding:20px;overflow:auto}
#menu button{margin:4px;padding:8px 14px;background:#222;color:#fff;border:1px solid #0af;cursor:pointer}
#menu button:hover{background:#0af;color:#000}
.hide{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu"></div>
<script>
// ===== PART 1: DATA & PHYSICS =====
const cv=document.getElementById('c'),g=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();onresize=rs;

const CARS=[
 {n:'Street Coupe',mass:1300,hp:220,grip:1.0,gears:[3.6,2.2,1.5,1.1,0.85],price:0},
 {n:'Muscle V8',mass:1600,hp:380,grip:0.95,gears:[3.2,2.0,1.4,1.0,0.8],price:15000},
 {n:'Tuner Rocket',mass:1250,hp:320,grip:1.1,gears:[3.8,2.3,1.6,1.15,0.9],price:22000},
 {n:'Hyper GT',mass:1500,hp:620,grip:1.2,gears:[3.4,2.1,1.5,1.1,0.85],price:60000}
];
const UPG=['engine','turbo','tires','suspension','transmission','nitrous','exhaust','grip'];
const save=JSON.parse(localStorage.getItem('drsim')||'{"cash":5000,"car":0,"owned":[0],"up":{}}');
function store(){localStorage.setItem('drsim',JSON.stringify(save))}
function lvl(k){return save.up[save.car+k]||0}

function stats(){
 const c=CARS[save.car];
 return {
  hp:c.hp*(1+0.08*lvl('engine')+0.12*lvl('turbo')+0.03*lvl('exhaust')),
  grip:c.grip*(1+0.07*lvl('tires')+0.05*lvl('grip')+0.03*lvl('suspension')),
  mass:c.mass,
  gears:c.gears.map(r=>r*(1+0.025*lvl('transmission'))),
  turbo:lvl('turbo')>0,
  nos:lvl('nitrous')
 };
}
// Part 2 continues below...
// ===== PART 2: RACE ENGINE, AI, SOUND =====
let mode='menu',dist=402,sim=null,keys={};
onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(mode==='race'||mode==='free'){if(e.key==='ArrowUp'||e.key==='e')shift(1);if(e.key==='ArrowDown'||e.key==='q')shift(-1);if(e.key==='n')useNos();if(e.key==='Escape')toMenu()}};
onkeyup=e=>{keys[e.key.toLowerCase()]=false};

// ---- Audio: engine, turbo whistle, blow-off, nitrous ----
let AC=null,eng,engG,whis,whisG;
function initAudio(){
 if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
 eng=AC.createOscillator();eng.type='sawtooth';engG=AC.createGain();engG.gain.value=0.08;
 eng.connect(engG).connect(AC.destination);eng.start();
 whis=AC.createOscillator();whis.type='sine';whisG=AC.createGain();whisG.gain.value=0;
 whis.connect(whisG).connect(AC.destination);whis.start();
}
function blowOff(){
 if(!AC)return;
 const b=AC.createBuffer(1,AC.sampleRate*0.4,AC.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
 const s=AC.createBufferSource();s.buffer=b;
 const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=2500;
 const gn=AC.createGain();gn.gain.value=0.25;
 s.connect(f).connect(gn).connect(AC.destination);s.start();
}
function soundUpdate(){
 if(!AC||!sim)return;
 eng.frequency.value=40+sim.rpm/60*2.2;
 engG.gain.value=0.05+0.07*sim.throttle;
 const st=stats();
 whis.frequency.value=900+sim.boost*2600;
 whisG.gain.value=st.turbo?Math.min(0.1,sim.boost*0.1):0;
}

// ---- Simulation ----
function newSim(opp){
 return {x:0,v:0,rpm:1000,gear:0,throttle:0,boost:0,t:0,started:false,
  lights:0,lightT:0,finished:false,shiftT:0,nos:0,nosT:0,pitch:0,
  opp:opp?{x:0,v:0}:null,oppDone:false,result:''};
}
function shift(d){
 if(!sim)return;
 const n=sim.gear+d,max=stats().gears.length-1;
 if(n<0||n>max)return;
 if(d>0&&sim.boost>0.5)blowOff();
 sim.gear=n;sim.shiftT=0.25;
}
function useNos(){
 if(sim&&sim.nos<stats().nos&&sim.nosT<=0){sim.nos++;sim.nosT=2.5}
}

function step(dt){
 const s=stats(),S=sim;
 const gr=s.gears[S.gear]*3.7;
 S.throttle=keys[' ']||keys['w']?Math.min(1,S.throttle+dt*4):Math.max(0,S.throttle-dt*5);
 if(mode==='race'&&!S.started)S.throttle=Math.min(S.throttle,0.6);
 const wheelR=0.32;
 S.rpm=Math.max(1000,Math.min(7500,S.v/wheelR*gr*60/(2*Math.PI)));
 if(S.rpm>=7400&&S.throttle>0)S.rpm=7400;
 let boostTarget=s.turbo?Math.max(0,(S.rpm-2500)/5000)*S.throttle:0;
 S.boost+=(boostTarget-S.boost)*Math.min(1,dt*1.5);
 if(S.throttle<0.2&&S.boost>0.7&&!S.vented){blowOff();S.vented=true}
 if(S.boost<0.5)S.vented=false;
 // power curve
 const pk=1-Math.pow((S.rpm-5500)/5000,2);
 let power=s.hp*745.7*Math.max(0.35,pk)*S.throttle*(1+S.boost*0.35);
 if(S.nosT>0){power*=1.35;S.nosT-=dt}
 if(S.shiftT>0){power*=0.1;S.shiftT-=dt}
 const vv=Math.max(S.v,3);
 let force=power/vv;
 const gripMax=s.grip*s.mass*9.81*1.1*(0.55+0.2*Math.min(1,s.grip));
 force=Math.min(force,gripMax);
 const drag=0.5*1.2*0.32*2.2*S.v*S.v+s.mass*9.81*0.015;
 const a=(force-drag)/s.mass;
 if(S.rpm>=7400&&S.throttle>0.5&&gr>0)S.v+=Math.min(a,0)*dt;else S.v+=a*dt;
 S.v=Math.max(0,S.v);S.x+=S.v*dt;
 // inertia: body pitches back under acceleration
 const target=Math.max(-0.5,Math.min(1,a/9));
 S.pitch+=(target-S.pitch)*Math.min(1,dt*3.5);
}
// Part 3 continues below...
  // ===== PART 3: OPPONENT, RACE FLOW, COCKPIT =====
function startRace(){
 initAudio();
 sim=newSim(true);mode='race';sim.lightT=0;
 document.getElementById('menu').classList.add('hide');
}
function startFree(){
 initAudio();
 sim=newSim(false);mode='free';
 document.getElementById('menu').classList.add('hide');
}

// Opponent: always a touch slower than you, so you win by a hair.
function stepOpp(dt){
 const S=sim,o=S.opp;
 if(!o||!S.started)return;
 // Target the player's own pace, then shave about 1.5 percent off it.
 const me=S.v,t=S.t;
 const pace=Math.max(me,6+t*7);
 const aim=pace*0.985;
 o.v+=(aim-o.v)*Math.min(1,dt*2.2);
 // after the player finishes, the AI is guaranteed behind by a small gap
 o.x+=o.v*dt;
 if(o.x>=S.x-0.4&&S.x<dist*0.97)o.x=S.x-0.4-Math.random()*0.15;
}

function raceFlow(dt){
 const S=sim;
 if(mode!=='race')return;
 if(!S.started){
  S.lightT+=dt;
  S.lights=Math.min(3,Math.floor(S.lightT/0.8));
  if(S.lightT>3.2){S.started=true;S.lights=4}
  return;
 }
 S.t+=dt;
 stepOpp(dt);
 if(!S.finished&&S.x>=dist){
  S.finished=true;S.et=S.t;S.trap=S.v*2.237;
  S.win=!S.opp||S.opp.x<dist;
 }
 if(S.finished&&!S.paid){
  S.paid=true;
  if(S.win){save.cash+=Math.round(dist>500?2500:1500);store()}
  S.result=S.win?'YOU WIN  ET '+S.et.toFixed(2)+'s  '+S.trap.toFixed(0)+' mph':'YOU LOSE';
 }
 if(S.finished&&S.t>S.et+6)toMenu();
}

// ---- Cockpit drawing ----
function drawGauge(cx,cy,r,val,max,label,redFrom){
 g.save();g.translate(cx,cy);
 g.fillStyle='#050505';g.beginPath();g.arc(0,0,r,0,7);g.fill();
 g.strokeStyle='#555';g.lineWidth=3;g.stroke();
 for(let i=0;i<=10;i++){
  const a=Math.PI*0.75+i/10*Math.PI*1.5;
  g.strokeStyle=(redFrom&&i/10>=redFrom)?'#f33':'#ddd';g.lineWidth=2;
  g.beginPath();g.moveTo(Math.cos(a)*r*0.8,Math.sin(a)*r*0.8);g.lineTo(Math.cos(a)*r*0.92,Math.sin(a)*r*0.92);g.stroke();
  g.fillStyle='#ddd';g.font=(r*0.14)+'px monospace';g.textAlign='center';
  g.fillText(Math.round(i/10*max),Math.cos(a)*r*0.65,Math.sin(a)*r*0.65+4);
 }
 const a=Math.PI*0.75+Math.min(1,Math.max(0,val/max))*Math.PI*1.5;
 g.strokeStyle='#f60';g.lineWidth=3;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*r*0.85,Math.sin(a)*r*0.85);g.stroke();
 g.fillStyle='#aaa';g.font=(r*0.15)+'px monospace';g.fillText(label,0,r*0.5);
 g.restore();
}

function drawRoadAndWorld(){
 const w=cv.width,h=cv.height,S=sim,hz=h*0.42+S.pitch*h*0.05;
 const sky=g.createLinearGradient(0,0,0,hz);sky.addColorStop(0,'#0a1230');sky.addColorStop(1,'#e98a4a');
 g.fillStyle=sky;g.fillRect(0,0,w,hz);
 g.fillStyle='#1a2a14';g.fillRect(0,hz,w,h-hz);
 // road
 g.fillStyle='#2b2b2e';g.beginPath();g.moveTo(w*0.47,hz);g.lineTo(w*0.53,hz);g.lineTo(w*0.95,h);g.lineTo(w*0.05,h);g.fill();
 // moving lane dashes give the feeling of speed
 g.strokeStyle='#ddd';
 for(let i=0;i<14;i++){
  const z=((i*8-(S.x%8)+112)%112)/112;
  const p=Math.pow(1-z,2.2);
  const y=hz+(h-hz)*p,len=4+60*p,wd=1+6*p;
  g.lineWidth=wd;g.beginPath();g.moveTo(w/2,y);g.lineTo(w/2,y+len);g.stroke();
 }
 // finish line approaching in race mode
 if(mode==='race'){
  const rem=dist-S.x;
  if(rem>0&&rem<150){
   const p=Math.pow(1-rem/150,2.2),y=hz+(h-hz)*p;
   g.fillStyle='#fff';g.fillRect(w*(0.5-0.03-0.4*p),y,w*(0.06+0.8*p),2+10*p);
  }
  // opponent car ahead or alongside, drawn in the left lane
  if(S.opp){
   const gap=S.opp.x-S.x;
   const p=Math.max(0.02,Math.min(1.1,0.6+gap/60));
   const sc=Math.pow(Math.max(0.05,p),1.8);
   const ox=w*(0.5-0.12-0.2*sc),oy=hz+(h-hz)*sc;
   g.fillStyle='#c22';g.fillRect(ox-30*sc*6,oy-40*sc*3,60*sc*6,30*sc*3);
   g.fillStyle='#600';g.fillRect(ox-24*sc*6,oy-55*sc*3,48*sc*6,18*sc*3);
  }
 }
}
// Part 4 continues below...
// ===== PART 4: COCKPIT, FREE ROAM, MENU, LOOP =====
function drawCockpit(){
 const w=cv.width,h=cv.height,S=sim,s=stats();
 // inertia: whole dash shifts as you are pushed back into the seat
 const sink=S.pitch*h*0.03,shake=S.v>30?(Math.random()-0.5)*S.throttle*2:0;
 g.save();g.translate(shake,sink);
 // dashboard
 const dg=g.createLinearGradient(0,h*0.62,0,h);dg.addColorStop(0,'#1c1c1f');dg.addColorStop(1,'#050505');
 g.fillStyle=dg;g.beginPath();g.moveTo(0,h*0.72);g.quadraticCurveTo(w/2,h*0.58,w,h*0.72);g.lineTo(w,h);g.lineTo(0,h);g.fill();
 // A pillars and roof edge
 g.fillStyle='#0a0a0a';
 g.beginPath();g.moveTo(0,0);g.lineTo(w*0.09,0);g.lineTo(w*0.02,h*0.7);g.lineTo(0,h*0.72);g.fill();
 g.beginPath();g.moveTo(w,0);g.lineTo(w*0.91,0);g.lineTo(w*0.98,h*0.7);g.lineTo(w,h*0.72);g.fill();
 g.fillRect(0,0,w,h*0.05);
 // rear view mirror
 g.fillStyle='#111';g.fillRect(w*0.44,h*0.05,w*0.12,h*0.07);
 g.fillStyle='#456';g.fillRect(w*0.445,h*0.055,w*0.11,h*0.06);
 // steering wheel
 const wx=w*0.32,wy=h*0.9,wr=h*0.22;
 g.strokeStyle='#111';g.lineWidth=h*0.035;g.beginPath();g.ellipse(wx,wy,wr*1.1,wr,0,0,7);g.stroke();
 g.lineWidth=h*0.02;g.beginPath();g.moveTo(wx-wr,wy);g.lineTo(wx+wr,wy);g.moveTo(wx,wy);g.lineTo(wx,wy+wr);g.stroke();
 // gauges behind the wheel
 const mph=S.v*2.237;
 drawGauge(wx-h*0.12,h*0.74,h*0.12,S.rpm/1000,8,'RPM x1000',0.85);
 drawGauge(wx+h*0.12,h*0.74,h*0.12,mph,200,'MPH',0);
 // boost gauge, centre console
 drawGauge(w*0.52,h*0.7,h*0.085,S.boost*20,25,'BOOST psi',0.8);
 // gear display
 g.fillStyle='#000';g.fillRect(w*0.46,h*0.78,w*0.05,h*0.07);
 g.fillStyle=S.shiftT>0?'#fa0':'#0f6';g.font=(h*0.05)+'px monospace';g.textAlign='center';
 g.fillText(String(S.gear+1),w*0.485,h*0.83);
 // warning lights
 const lamps=[['SHIFT',S.rpm>6800,'#f33'],['TURBO',s.turbo&&S.boost>0.5,'#0af'],['NOS',S.nosT>0,'#a4f'],['ABS',S.v>1&&S.throttle>0.9&&S.v<8,'#fa0']];
 lamps.forEach((l,i)=>{
  const lx=w*0.58+i*w*0.04,ly=h*0.67;
  g.fillStyle=l[1]?l[2]:'#222';g.beginPath();g.arc(lx,ly,h*0.012,0,7);g.fill();
  if(l[1]){g.shadowColor=l[2];g.shadowBlur=15;g.fill();g.shadowBlur=0}
  g.fillStyle='#777';g.font=(h*0.016)+'px monospace';g.fillText(l[0],lx,ly+h*0.03);
 });
 // starting lights tree
 if(mode==='race'&&S.lights<4){
  for(let i=0;i<3;i++){
   g.fillStyle=S.lights>i?(i===2?'#0f4':'#fc0'):'#222';
   g.beginPath();g.arc(w/2,h*0.18+i*h*0.06,h*0.022,0,7);g.fill();
  }
 }
 // shifter and hand: hand pushes the lever when a shift happens
 const lx=w*0.66,ly=h*0.95;
 const push=S.shiftT>0?Math.sin((0.25-S.shiftT)/0.25*Math.PI):0;
 const kx=lx+push*h*0.04,ky=ly-h*0.18-push*h*0.03;
 g.strokeStyle='#999';g.lineWidth=h*0.012;g.beginPath();g.moveTo(lx,ly);g.lineTo(kx,ky);g.stroke();
 g.fillStyle='#222';g.beginPath();g.arc(kx,ky,h*0.025,0,7);g.fill();
 // hand and forearm
 g.fillStyle='#d9a47c';
 g.beginPath();g.ellipse(kx,ky-h*0.005,h*0.04,h*0.032,-0.3,0,7);g.fill();
 g.beginPath();g.moveTo(kx+h*0.02,ky);g.lineTo(w*0.82,h);g.lineTo(w*0.9,h);g.lineTo(kx+h*0.04,ky-h*0.02);g.fill();
 g.fillStyle='#b88660';
 for(let i=0;i<4;i++){g.beginPath();g.ellipse(kx-h*0.03+i*h*0.016,ky-h*0.03,h*0.008,h*0.016,0,0,7);g.fill()}
 g.restore();
 // vignette
 const vg=g.createRadialGradient(w/2,h/2,h*0.4,w/2,h/2,h*0.9);
 vg.addColorStop(0,'#0000');vg.addColorStop(1,'#000a');g.fillStyle=vg;g.fillRect(0,0,w,h);
 // speed blur streaks at high speed
 if(mph>90){
  g.strokeStyle='rgba(255,255,255,'+Math.min(0.25,(mph-90)/400)+')';g.lineWidth=1;
  for(let i=0;i<20;i++){
   const a=Math.random()*6.28,r1=h*0.3+Math.random()*h*0.2;
   g.beginPath();g.moveTo(w/2+Math.cos(a)*r1,h*0.4+Math.sin(a)*r1*0.6);
   g.lineTo(w/2+Math.cos(a)*(r1+40+mph*0.3),h*0.4+Math.sin(a)*(r1+40+mph*0.3)*0.6);g.stroke();
  }
 }
 // timer and result
 g.fillStyle='#fff';g.font='20px monospace';g.textAlign='left';
 if(mode==='race'){
  g.fillText('ET '+S.t.toFixed(2)+'s   '+Math.max(0,dist-S.x).toFixed(0)+' m to go',20,30);
  if(S.result){g.font='40px monospace';g.textAlign='center';g.fillStyle=S.win?'#0f6':'#f33';g.fillText(S.result,w/2,h*0.3)}
 }else{
  g.fillText('FREE ROAM  '+mph.toFixed(0)+' mph   Esc = menu',20,30);
 }
 g.font='14px monospace';g.fillStyle='#aaa';
 g.fillText('W/Space throttle | E/Up shift up | Q/Down shift down | N nitrous',20,cv.height-14);
}

// ---- Free roam highway: endless road with scenery and traffic ----
let traffic=[];
function freeRoam(dt){
 const S=sim;
 if(Math.random()<dt*0.4&&traffic.length<6)traffic.push({x:S.x+300+Math.random()*300,v:18+Math.random()*10,lane:Math.random()<0.5?-1:1});
 traffic.forEach(c=>c.x+=c.v*dt);
 traffic=traffic.filter(c=>c.x>S.x-50);
}
function drawTraffic(){
 const w=cv.width,h=cv.height,S=sim,hz=h*0.42+S.pitch*h*0.05;
 traffic.forEach(c=>{
  const gap=c.x-S.x;if(gap<4||gap>250)return;
  const p=Math.pow(1-gap/250,2.2),y=hz+(h-hz)*p,sc=0.2+p*3;
  const x=w*(0.5+c.lane*0.1*(0.3+p*2.2));
  g.fillStyle=c.lane<0?'#2a6':'#26a';
  g.fillRect(x-28*sc,y-26*sc,56*sc,24*sc);
  g.fillStyle='#111';g.fillRect(x-22*sc,y-38*sc,44*sc,14*sc);
  g.fillStyle='#f22';g.fillRect(x-26*sc,y-14*sc,10*sc,5*sc);g.fillRect(x+16*sc,y-14*sc,10*sc,5*sc);
 });
 // roadside poles for scenery
 g.fillStyle='#333';
 for(let i=0;i<10;i++){
  const z=((i*30-(S.x%30)+300)%300)/300,p=Math.pow(1-z,2.4);
  const y=hz+(h-hz)*p,hh=10+120*p;
  g.fillRect(w*(0.5-0.06-0.5*p)-3*p,y-hh,2+6*p,hh);
  g.fillRect(w*(0.5+0.06+0.5*p),y-hh,2+6*p,hh);
 }
}

// ---- Menu with upgrades and car shop ----
function toMenu(){
 mode='menu';sim=null;traffic=[];
 const m=document.getElementById('menu');m.classList.remove('hide');
 const c=CARS[save.car];
 let html='<h1>DRAG RACING SIM</h1><h3>Cash: $'+save.cash+'  |  Car: '+c.n+'</h3>';
 html+='<h3>Race</h3><button onclick="dist=402;startRace()">Quarter mile</button><button onclick="dist=805;startRace()">Half mile</button><button onclick="startFree()">Free roam highway</button>';
 html+='<h3>Garage</h3>';
 CARS.forEach((car,i)=>{
  const own=save.owned.includes(i);
  html+='<button onclick="buyCar('+i+')">'+car.n+(own?(save.car===i?' (driving)':' (owned, select)'):' - $'+car.price)+'</button>';
 });
 html+='<h3>Upgrades for '+c.n+'</h3>';
 UPG.forEach(u=>{
  const l=lvl(u),cost=500*(l+1)*(l+1);
  html+='<button onclick="buyUp(\''+u+'\')">'+u+' L'+l+(l>=5?' MAX':' - $'+cost)+'</button>';
 });
 html+='<p>Controls: W or Space throttle, E or Up arrow shift up, Q or Down arrow shift down, N nitrous, Esc back to menu.</p>';
 m.innerHTML=html;
}
function buyCar(i){
 if(save.owned.includes(i)){save.car=i}
 else if(save.cash>=CARS[i].price){save.cash-=CARS[i].price;save.owned.push(i);save.car=i}
 store();toMenu();
}
function buyUp(u){
 const l=lvl(u),cost=500*(l+1)*(l+1);
 if(l<5&&save.cash>=cost){save.cash-=cost;save.up[save.car+u]=l+1;store()}
 toMenu();
}

// ---- Main loop ----
let last=performance.now();
function loop(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(sim&&(mode==='race'||mode==='free')){
  if(mode==='free'){sim.started=true;freeRoam(dt)}
  raceFlow(dt);
  if(!(mode==='race'&&sim.finished&&sim.t>sim.et+0.01&&false))step(dt);
  soundUpdate();
  drawRoadAndWorld();
  if(mode==='free')drawTraffic();
  drawCockpit();
 }else{
  g.fillStyle='#000';g.fillRect(0,0,cv.width,cv.height);
 }
 requestAnimationFrame(loop);
}
// ===== PART 5: TOUCH CONTROLS =====
const touch={thr:0,id:null,y0:0};
const btn={up:null,dn:null,nos:null,menu:null};

function layoutButtons(){
 const w=cv.width,h=cv.height,r=Math.min(w,h)*0.075;
 btn.up={x:w*0.1,y:h*0.45,r};
 btn.dn={x:w*0.1,y:h*0.68,r};

// ---- Gate for each level: returns how ready the player is ----
function upCount(minLvl){
 let n=0;
 UPG.forEach(u=>{if(u!=='goldturbo'&&lvl(u)>=minLvl)n++});
 return n;
}
function meetsGate(L){
 if(L<=4)return true;
 if(L===5)return lvl('engine')>=2&&lvl('turbo')>=2&&lvl('grip')>=2;
 if(L<=9)return lvl('engine')>=3&&lvl('turbo')>=3&&lvl('grip')>=3;
 if(L<=14)return upCount(4)>=4;
 if(L===15)return upCount(5)>=8;
 if(L===16)return lvl('goldturbo')>=1&&save.car===GOLD_ID;
 return true;
}
// How far above the gate the player is, used to decide how easy the win is
function surplus(L){
 let s=0;
 UPG.forEach(u=>{if(u!=='goldturbo')s+=lvl(u)});
 const need=[0,0,0,0,0,6,9,9,9,9,16,18,20,22,24,40];
 return s-(need[L]||0);
}

// ---- Opponent speed is now decided by the career level ----
stepOpp=function(dt){
 const S=sim,o=S.opp;
 if(!o||!S.started)return;
 const L=save.level,ok=meetsGate(L);
 const pace=Math.max(S.v,6+S.t*7);
 let k;
 if(!ok)k=1.03; // under-upgraded: the rival is faster than you
 else k=Math.max(0.90,0.985-Math.min(0.08,surplus(L)*0.004)); // above the gate: easier
 const aim=pace*k;
 o.v+=(aim-o.v)*Math.min(1,dt*2.2);
 o.x+=o.v*dt;
 if(ok){
  const gapBehind=0.6+Math.min(2.5,S.v*0.04);
  if(o.x>S.x-gapBehind)o.x=S.x-gapBehind;
 }else{
  // rival pulls just ahead of you
  const lead=1+Math.min(4,S.v*0.05);
  if(o.x<S.x+lead)o.x=S.x+lead;
 }
 if(o.x<0)o.x=0;
};

// ---- Race flow with career results ----
raceFlow=function(dt){
 const S=sim;
 if(mode!=='race')return;
 if(!S.started){
  S.lightT+=dt;
  S.lights=Math.min(3,Math.floor(S.lightT/0.8));
  if(S.lightT>3.2){S.started=true;S.lights=4}
  return;
 }
 S.t+=dt;
 stepOpp(dt);
 const L=save.level;
 if(!S.finished&&S.x>=dist){
  S.finished=true;S.et=S.t;S.trap=S.v*2.237;
  S.win=S.opp.x<dist&&meetsGate(L);
  S.doneAt=performance.now();
 }
 if(!S.finished&&S.opp&&S.opp.x>=dist){
  S.finished=true;S.et=S.t;S.trap=S.v*2.237;S.win=false;S.doneAt=performance.now();
 }
 if(S.finished&&!S.paid){
  S.paid=true;
  const base=dist>500?2500:1500;
  if(S.win){
   const prize=Math.round(base*(1+L*0.35));
   save.cash+=prize;
   S.result='LEVEL '+L+' WON  +$'+prize+'  ET '+S.et.toFixed(2)+'s';
   if(L===save.level&&L<16)save.level=L+1;
   if(L===15){
    save.gold=true;
    if(!save.owned.includes(GOLD_ID))save.owned.push(GOLD_ID);
    S.result='LEVEL 15 WON! SECRET LEVEL 16 UNLOCKED';
   }
   if(L===16){save.done=true;S.ending=true;S.endT=0}
  }else{
   const prize=Math.round(base*0.2);
   save.cash+=prize;
   const hintTxt=L===5?'Need engine, turbo, grip at 2':L<=9?'Need engine, turbo, grip at 3':L<=14?'Need 4 upgrades at level 4':L===15?'Need every upgrade maxed':'Need the Golden Turbo on the Gold R34';
   S.result='LEVEL '+L+' LOST  +$'+prize+'  '+hintTxt;
  }
  store();
 }
 if(S.finished&&!S.ending&&performance.now()-S.doneAt>8000)toMenu();
 if(!S.finished&&S.t>90){S.finished=true;S.et=S.t;S.win=false;S.doneAt=performance.now();S.paid=true;S.result='TIME OUT  tap to go back'}
};

// ---- Engine rumble: replaces the droney single oscillator ----
let rum=null;
function buildRumble(){
 if(rum||!AC)return;
 rum={};
 // low sub rumble
 rum.sub=AC.createOscillator();rum.sub.type='sine';
 rum.subG=AC.createGain();rum.subG.gain.value=0.0;
 rum.sub.connect(rum.subG).connect(AC.destination);rum.sub.start();
 // main body: square wave through a low pass for a chunky burble
 rum.body=AC.createOscillator();rum.body.type='square';
 rum.lp=AC.createBiquadFilter();rum.lp.type='lowpass';rum.lp.frequency.value=300;
 rum.bodyG=AC.createGain();rum.bodyG.gain.value=0.0;
 rum.body.connect(rum.lp).connect(rum.bodyG).connect(AC.destination);rum.body.start();
 // cylinder pulse: a slow tremolo on the body gives the lumpy V8 burble
 rum.lfo=AC.createOscillator();rum.lfo.type='sawtooth';
 rum.lfoG=AC.createGain();rum.lfoG.gain.value=0.04;
 rum.lfo.connect(rum.lfoG).connect(rum.bodyG.gain);rum.lfo.start();
 // exhaust crackle noise
 const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),nd=nb.getChannelData(0);
 for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 rum.noise=AC.createBufferSource();rum.noise.buffer=nb;rum.noise.loop=true;
 rum.nf=AC.createBiquadFilter();rum.nf.type='bandpass';rum.nf.frequency.value=180;rum.nf.Q.value=0.8;
 rum.nG=AC.createGain();rum.nG.gain.value=0;
 rum.noise.connect(rum.nf).connect(rum.nG).connect(AC.destination);rum.noise.start();
 // silence the old droning oscillator
 if(typeof engG!=='undefined'&&engG)engG.gain.value=0;
}
soundUpdate=function(){
 if(!AC||!sim)return;
 buildRumble();
 if(!rum)return;
 const st=stats(),r=sim.rpm,th=sim.throttle;
 // firing rate for a V8: rpm/60 * 4 pulses a second
 const fire=r/60*4;
 rum.sub.frequency.value=Math.max(24,fire*0.5);
 rum.subG.gain.value=0.16+0.1*th;
 rum.body.frequency.value=Math.max(30,fire*0.9);
 rum.lp.frequency.value=220+r*0.12+th*350;
 rum.bodyG.gain.value=0.06+0.08*th;
 rum.lfo.frequency.value=Math.max(6,fire*0.25);
 rum.nf.frequency.value=140+r*0.05;
 rum.nG.gain.value=0.03+0.08*th;
 if(typeof engG!=='undefined'&&engG)engG.gain.value=0;
 // turbo whistle stays, quieter and higher
 if(typeof whis!=='undefined'&&whis){
  whis.frequency.value=1200+sim.boost*2800;
  whisG.gain.value=st.turbo?Math.min(0.08,sim.boost*0.09):0;
 }
};

 const real=save.car;
 save.car=CARS[real].snd;
 try{_sndKeyP11()}finally{save.car=real}
};

// Payouts: replace the flat prize with the level scaled one
const _raceFlowP11=raceFlow;
raceFlow=function(dt){
 const S=sim;
 const before=S&&!S.paid;
 const cashBefore=save.cash;
 _raceFlowP11(dt);
 if(before&&S&&S.paid&&!S.falseStart&&!S.foul){
  // undo the old payout, apply the scaled one
  const gained=save.cash-cashBefore;
  save.cash=cashBefore;
  const full=prizeFor(save.level>1&&S.win?save.level-1:save.level,dist>500);
  save.cash+=S.win?full:Math.round(full*0.18);
  store();
 }
};

// Make sure a new save has the right starting state
if(save.level===undefined)save.level=1;
save.owned=save.owned.filter(i=>i<CARS.length);
if(!save.owned.includes(0))save.owned.push(0);
if(save.car>=CARS.length)save.car=0;
if(save.gold&&!save.owned.includes(GOLD_ID2))save.owned.push(GOLD_ID2);
 toMenu();requestAnimationFrame(loop);
</script>
