
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Street Racing Simulator</title>
<style>
* { box-sizing: border-box; }
body {
 margin:0;
 overflow:hidden;
 background:#080808;
 color:white;
 font-family:Arial;
}
canvas { display:block; }
#hud {
 position:fixed;
 inset:0;
 pointer-events:none;
}
#top {
 display:flex;
 justify-content:space-between;
 padding:20px;
 font-weight:bold;
}
#speed {
 position:absolute;
 bottom:130px;
 left:50%;
 transform:translateX(-50%);
 font-size:45px;
 text-align:center;
}
#speed small {
 display:block;
 font-size:13px;
}
#controls {
 position:fixed;
 bottom:15px;
 width:100%;
 display:flex;
 justify-content:space-between;
 padding:10px;
}
button {
 background:#202020;
 color:white;
 border:1px solid #666;
 border-radius:12px;
 padding:20px;
 font-weight:bold;
}
#accelerate {
 background:#b52222;
}
#nitrous {
 background:#075b91;
}
#menu {
 position:fixed;
 inset:0;
 background:#080808;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 z-index:5;
}
#menu button { min-width:180px; }
</style>
</head>
<body>

<div id="menu">
<h1>STREET RACING</h1>
<p>FIRST PERSON DRAG SIMULATOR</p>
<button onclick="startGame()">START RACING</button>
</div>

<div id="hud">
<div id="top">
<span id="gear">GEAR: 1</span>
<span id="nitroStatus">NITRO: READY</span>
</div>

<div id="speed">
0
<small>KM/H</small>
</div>
</div>

<div id="controls">
<div>
<button id="left">LEFT</button>
<button id="right">RIGHT</button>
</div>
<div>
<button id="shift">SHIFT</button>
<button id="nitrous">N2O</button>
<button id="accelerate">ACCEL</button>
</div>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x819bb5);
scene.fog = new THREE.Fog(0x819bb5,40,180);

const camera = new THREE.PerspectiveCamera(
75,window.innerWidth/window.innerHeight,0.1,300
);
camera.position.set(0,1.5,0);
scene.add(camera);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x444455,2));

const sun = new THREE.DirectionalLight(0xffffff,2);
sun.position.set(10,20,10);
scene.add(sun);

// ROAD
const road = new THREE.Mesh(
new THREE.PlaneGeometry(16,300),
new THREE.MeshStandardMaterial({color:0x252525})
);
road.rotation.x=-Math.PI/2;
road.position.z=-100;
scene.add(road);

// ROAD MARKINGS
const lines=[];
for(let i=0;i<40;i++){
const line=new THREE.Mesh(
new THREE.BoxGeometry(0.2,0.03,3),
new THREE.MeshBasicMaterial({color:0xffffff})
);
line.position.set(0,0.03,-i*7);
scene.add(line);
lines.push(line);
}

// ENVIRONMENT
const buildings=[];
for(let i=0;i<35;i++){
for(const side of [-1,1]){
const h=4+Math.random()*12;
const building=new THREE.Mesh(
new THREE.BoxGeometry(5,h,7),
new THREE.MeshStandardMaterial({color:0x555566})
);
building.position.set(side*17,h/2,-i*12);
scene.add(building);
buildings.push(building);
}
}

// COCKPIT
const cockpit=new THREE.Group();
camera.add(cockpit);

const dashboard=new THREE.Mesh(
new THREE.BoxGeometry(2.3,0.35,0.9),
new THREE.MeshStandardMaterial({color:0x111111})
);
dashboard.position.set(0,-0.6,-1);
cockpit.add(dashboard);

const bonnet=new THREE.Mesh(
new THREE.BoxGeometry(1.8,0.12,2.5),
new THREE.MeshStandardMaterial({
color:0x222222,metalness:0.6
})
);
bonnet.position.set(0,-0.35,-2);
cockpit.add(bonnet);

const wheel=new THREE.Mesh(
new THREE.TorusGeometry(0.32,0.045,12,32),
new THREE.MeshStandardMaterial({color:0x080808})
);
wheel.position.set(0,-0.48,-0.8);
cockpit.add(wheel);

let speed=0;
let gear=1;
let rpm=900;
let acceleration=false;
let nitrous=false;
let steering=0;
let nitroFuel=100;
let started=false;

let audio;
let engine;
let engineGain;
let turbo;
let turboGain;

function startAudio(){
if(audio){
audio.resume();
return;
}
audio=new AudioContext();

engine=audio.createOscillator();
engine.type="sawtooth";
engineGain=audio.createGain();
engineGain.gain.value=0.02;
engine.connect(engineGain);
engineGain.connect(audio.destination);
engine.start();

turbo=audio.createOscillator();
turbo.type="sine";
turboGain=audio.createGain();
turboGain.gain.value=0;
turbo.connect(turboGain);
turboGain.connect(audio.destination);
turbo.start();
}

function startGame(){
startAudio();
started=true;
document.getElementById("menu").style.display="none";
}

function shift(){
if(!started)return;
if(gear<6)gear++;
rpm=Math.max(1800,rpm-2200);
document.getElementById("gear").innerText="GEAR: "+gear;
}

function updateAudio(){
if(!audio)return;
engine.frequency.setTargetAtTime(
35+rpm*0.025,audio.currentTime,0.06
);
engineGain.gain.setTargetAtTime(
acceleration?0.06:0.015,audio.currentTime,0.1
);
turbo.frequency.setTargetAtTime(
700+rpm*0.15,audio.currentTime,0.1
);
turboGain.gain.setTargetAtTime(
acceleration?0.015:0,audio.currentTime,0.1
);
}

function bindHold(id,callback){
const el=document.getElementById(id);
el.addEventListener("pointerdown",e=>{
e.preventDefault();
callback(true);
});
["pointerup","pointercancel","pointerleave"].forEach(event=>{
el.addEventListener(event,()=>callback(false));
});
}

bindHold("accelerate",v=>acceleration=v);
bindHold("left",v=>steering=v?-1:0);
bindHold("right",v=>steering=v?1:0);
bindHold("nitrous",v=>nitrous=v);

document.getElementById("shift").addEventListener("click",shift);

// MAIN GAME LOOP
let last=performance.now();

function animate(now){
requestAnimationFrame(animate);

const dt=Math.min((now-last)/1000,0.05);
last=now;

if(started){

if(acceleration){
speed+= (nitrous && nitroFuel>0 ? 38:15)*dt;
}else{
speed-=10*dt;
}

if(nitrous && nitroFuel>0){
speed+=35*dt;
nitroFuel-=22*dt;
}

nitroFuel=Math.max(0,Math.min(100,nitroFuel));
speed=Math.max(0,Math.min(320,speed));

rpm=900+(speed/(65*gear))*6500;
rpm=Math.min(9000,rpm);

camera.rotation.z+=
(-steering*0.035-camera.rotation.z)*dt*5;

camera.position.x+=
steering*dt*speed*0.0005;

camera.position.x*=0.99;

// ACCELERATION INERTIA
const targetTilt=acceleration?-0.09:0;
camera.rotation.x+=
(targetTilt-camera.rotation.x)*dt*2;

// ROAD MOVEMENT
const movement=speed*dt*0.09;

lines.forEach(line=>{
line.position.z+=movement;
if(line.position.z>5)line.position.z-=280;
});

buildings.forEach(building=>{
building.position.z+=movement;
if(building.position.z>15)building.position.z-=420;
});

document.getElementById("speed").innerHTML=
Math.round(speed)+"<small>KM/H</small>";

document.getElementById("gear").innerText=
"GEAR: "+gear;

document.getElementById("nitroStatus").innerText=
"NITRO: "+Math.round(nitroFuel)+"%";

updateAudio();
}

renderer.render(scene,camera);
}

requestAnimationFrame(animate);

window.addEventListener("resize",()=>{
camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(innerWidth,innerHeight);
});

</script>
</body>
</html>
