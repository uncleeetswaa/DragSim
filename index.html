<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Drag Racing Sim</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:monospace;color:#fff;touch-action:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none}

#menu button{margin:8px;padding:16px 22px;font-size:20px;background:#222;color:#fff;border:1px solid #0af;cursor:pointer}
#menu button:hover{background:#0af;color:#000}
.hide{display:none}

<body>
<canvas id="c"></canvas>
<div id="menu"></div>
<script>
// ===== BLOCK 1: DATA, SAVE, STATS =====
const cv=document.getElementById('c'),g=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();

const CARS=[
 {n:'Nizzan Silvana',mass:1250,hp:230,grip:1.00,gears:[3.6,2.2,1.5,1.1,0.85],price:0,snd:0,drv:'RWD'},
 {n:'Hold On GTS',mass:1700,hp:400,grip:0.95,gears:[3.2,2.0,1.4,1.0,0.8],price:18000,snd:1,drv:'RWD V8'},
 {n:'Rotary Rocket',mass:1300,hp:340,grip:1.08,gears:[3.8,2.3,1.6,1.15,0.9],price:32000,snd:2,drv:'RWD rotary'},
 {n:'Toyoda Supreme',mass:1500,hp:520,grip:1.15,gears:[3.5,2.15,1.5,1.1,0.85],price:55000,snd:3,drv:'RWD turbo six'},
 {n:'BMW-ish Beamer',mass:1550,hp:650,grip:1.22,gears:[3.4,2.1,1.5,1.1,0.85],price:90000,snd:3,drv:'RWD twin turbo'},
 {n:'Golden Godzilla',mass:1450,hp:760,grip:1.30,gears:[3.5,2.2,1.55,1.15,0.88],price:0,snd:4,drv:'AWD gold',gold:true}
];
const GOLD_ID=5;
const UPG=['engine','turbo','tires','suspension','transmission','nitrous','exhaust','grip','goldturbo'];
const GOLD_TURBO_COST=120000;
const LAST_REG=4;

let save=JSON.parse(localStorage.getItem('drsim3')||'null')||{cash:5000,car:0,owned:[0],up:{},level:1,gold:false,done:false};
function store(){localStorage.setItem('drsim3',JSON.stringify(save))}
function lvl(k){return save.up[save.car+k]||0}

function stats(){
 const c=CARS[save.car];
 const s={
  hp:c.hp*(1+0.08*lvl('engine')+0.12*lvl('turbo')+0.03*lvl('exhaust')),
  grip:c.grip*(1+0.07*lvl('tires')+0.05*lvl('grip')+0.03*lvl('suspension')),
  mass:c.mass,
  gears:c.gears.map(r=>r*(1+0.025*lvl('transmission'))),
  turbo:lvl('turbo')>0,
  nos:lvl('nitrous')
 };
 if(lvl('goldturbo')>=1){s.hp*=1.25;s.turbo=true}
 return s;
}
// BLOCK 2 continues below...
// ===== BLOCK 2: CONTROLS, SOUND, PHYSICS, RACE FLOW =====
let mode='menu',dist=402,sim=null,keys={},traffic=[];
let camView=0; // 0 cockpit, 1 chase, 2 bumper
const LAUNCH_RPM=4800;
const touch={thr:0,id:null,y0:0};
const btn={up:null,dn:null,nos:null,menu:null,cam:null};

function layoutButtons(){
 const w=cv.width,h=cv.height,r=Math.min(w,h)*0.075;
 btn.nos={x:w*0.1,y:h*0.22,r};
 btn.up={x:w*0.1,y:h*0.45,r};
 btn.dn={x:w*0.1,y:h*0.68,r};
 btn.menu={x:w*0.94,y:h*0.1,r:r*0.7};
 btn.cam={x:w*0.84,y:h*0.1,r:r*0.7};
}
layoutButtons();
onresize=()=>{rs();layoutButtons()};
function hit(b,x,y){return Math.hypot(x-b.x,y-b.y)<b.r*1.2}

onkeydown=e=>{
 keys[e.key.toLowerCase()]=true;
 if(mode==='race'||mode==='free'){
  if(e.key==='ArrowUp'||e.key==='e')shift(1);
  if(e.key==='ArrowDown'||e.key==='q')shift(-1);
  if(e.key==='n')useNos();
  if(e.key==='c')camView=(camView+1)%3;
  if(e.key==='Escape')toMenu();
 }
};
onkeyup=e=>{keys[e.key.toLowerCase()]=false};

// ---- Audio ----
let AC=null,ES=null,esCar=-1,turboNodes=null;
function initAudio(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}

// One profile per sound type. pulses = firings per rev, uneven = lumpiness,
// rasp = noise, h = harmonic mix, lp = filter brightness.
const SOUNDS={
 0:{pulses:2,uneven:0.35,rasp:0.16,h:[1,0.5,0.35,0.2,0.12,0.08],lp:1700,sub:0.5,vol:0.95,wave:'sawtooth',turbo:{f:1500,type:'sine',vol:0.05}},
 1:{pulses:4,uneven:0.75,rasp:0.22,h:[1,0.85,0.5,0.3,0.15,0.08],lp:850,sub:1.0,vol:1.15,wave:'sawtooth',turbo:{f:900,type:'triangle',vol:0.05}},
 2:{pulses:3,uneven:0.55,rasp:0.6,h:[0.6,0.9,0.8,0.7,0.6,0.5],lp:3800,sub:0.15,vol:0.9,wave:'square',turbo:{f:2400,type:'sine',vol:0.05}},
 3:{pulses:3,uneven:0.30,rasp:0.25,h:[1,0.6,0.5,0.35,0.2,0.12],lp:2300,sub:0.7,vol:1.0,wave:'sawtooth',turbo:{f:1900,type:'sine',vol:0.09}},
 4:{pulses:3,uneven:0.30,rasp:0.30,h:[0.9,0.7,0.6,0.5,0.35,0.2],lp:2700,sub:0.6,vol:1.05,wave:'sawtooth',turbo:{f:1300,type:'sawtooth',vol:0.07,twin:true}}
};

function destroyEngineSound(){
 if(ES){try{ES.nodes.forEach(n=>{try{n.stop&&n.stop()}catch(e){}try{n.disconnect()}catch(e){}})}catch(e){}ES=null}
 if(turboNodes){try{turboNodes.nodes.forEach(n=>{try{n.stop&&n.stop()}catch(e){}try{n.disconnect()}catch(e){}})}catch(e){}turboNodes=null}
}
function buildEngineSound(){
 if(!AC)return;
 destroyEngineSound();
 const P=SOUNDS[CARS[save.car].snd]||SOUNDS[0];
 const nodes=[],out=AC.createGain();out.gain.value=0;
 const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=P.lp;lp.Q.value=1.2;
 const comp=AC.createDynamicsCompressor();
 out.connect(lp).connect(comp).connect(AC.destination);
 nodes.push(out,lp,comp);
 const hs=[];
 P.h.forEach((amp,i)=>{
  const o=AC.createOscillator();o.type=i===0?P.wave:'sine';
  const gn=AC.createGain();gn.gain.value=amp*0.12;
  o.connect(gn).connect(out);o.start();
  hs.push({o,gn,amp,n:i+1});nodes.push(o,gn);
 });
 const sub=AC.createOscillator();sub.type='sine';
 const subG=AC.createGain();subG.gain.value=0.2*P.sub;
 sub.connect(subG).connect(out);sub.start();nodes.push(sub,subG);
 // lumpy firing order: a wobble on pitch and a hard pulse on volume
 const wob=AC.createOscillator();wob.type='triangle';
 const wobP=AC.createGain();wobP.gain.value=14*P.uneven;
 wob.connect(wobP);hs.forEach(x=>wobP.connect(x.o.detune));
 const pulse=AC.createOscillator();pulse.type='sawtooth';
 const pulseG=AC.createGain();pulseG.gain.value=0.06*P.uneven;
 pulse.connect(pulseG).connect(out.gain);
 wob.start();pulse.start();nodes.push(wob,wobP,pulse,pulseG);
 // rasp noise
 const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),nd=nb.getChannelData(0);
 for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
 const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;
 const nf=AC.createBiquadFilter();nf.type='bandpass';nf.Q.value=1.4;
 const nG=AC.createGain();nG.gain.value=0;
 ns.connect(nf).connect(nG).connect(out);ns.start();nodes.push(ns,nf,nG);
 ES={P,hs,sub,wob,pulse,nf,nG,out,lp,nodes,crackleT:0,lastTh:0};
 // turbo whistle, different per car
 const tw=AC.createOscillator();tw.type=P.turbo.type;
 const tG=AC.createGain();tG.gain.value=0;
 tw.connect(tG).connect(AC.destination);tw.start();
 const tn=[tw,tG];
 let tw2=null;
 if(P.turbo.twin){tw2=AC.createOscillator();tw2.type='sine';tw2.connect(tG);tw2.start();tn.push(tw2)}
 turboNodes={tw,tw2,tG,nodes:tn};
 esCar=save.car;
}
function blowOff(){
 if(!AC)return;
 const b=AC.createBuffer(1,AC.sampleRate*0.4,AC.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);
 const s=AC.createBufferSource();s.buffer=b;
 const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=2500;
 const gn=AC.createGain();gn.gain.value=0.25;
 s.connect(f).connect(gn).connect(AC.destination);s.start();
}
function crackle(){
 if(!AC)return;
 const b=AC.createBuffer(1,AC.sampleRate*0.06,AC.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3);
 const s=AC.createBufferSource();s.buffer=b;
 const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=1200+Math.random()*1200;
 const gn=AC.createGain();gn.gain.value=0.2;
 s.connect(f).connect(gn).connect(AC.destination);s.start();
}
function bang(){
 if(!AC)return;
 const len=AC.sampleRate*0.18,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<len;i++){const e=Math.pow(1-i/len,2.5);d[i]=((Math.random()*2-1)*0.7+Math.sin(i/12)*0.6)*e}
 const s=AC.createBufferSource();s.buffer=b;
 const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=1800;
 const gn=AC.createGain();gn.gain.value=0.45;
 s.connect(f).connect(gn).connect(AC.destination);s.start();
}
function soundUpdate(){
 if(!AC||!sim)return;
 if(!ES||esCar!==save.car)buildEngineSound();
 if(!ES)return;
 const P=ES.P,r=sim.rpm,th=sim.throttle,st=stats(),car=CARS[save.car].snd;
 const fire=Math.max(18,r/60*P.pulses);
 ES.hs.forEach(x=>{x.o.frequency.value=fire*x.n});
 ES.sub.frequency.value=Math.max(20,fire*0.5);
 ES.wob.frequency.value=Math.max(3,fire*0.18);
 ES.pulse.frequency.value=Math.max(4,fire*0.5);
 ES.lp.frequency.value=P.lp*(0.45+0.9*th)+r*0.15;
 ES.nf.frequency.value=300+r*0.6;
 ES.nG.gain.value=P.rasp*(0.05+0.18*th);
 let loud=(0.10+0.16*th+Math.min(0.1,r/70000))*P.vol;
 if(car===2&&th<0.2)loud*=0.8+0.2*Math.sin(performance.now()/38);
 ES.out.gain.value=loud;
 if(car===3&&r>5500)ES.hs.forEach(x=>{x.gn.gain.value=x.amp*0.12*(1+(r-5500)/2500)});
 if(th<0.15&&ES.lastTh>0.6&&r>3500&&(car===4||car===1||car===2))ES.crackleT=0.5;
 if(ES.crackleT>0){ES.crackleT-=0.016;if(Math.random()<(car===4?0.45:0.25))crackle()}
 ES.lastTh=th;
 if(turboNodes){
  const T=P.turbo;
  turboNodes.tw.frequency.value=T.f+sim.boost*2800;
  if(turboNodes.tw2)turboNodes.tw2.frequency.value=T.f*1.5+sim.boost*3400;
  turboNodes.tG.gain.value=st.turbo?Math.min(T.vol*1.6,sim.boost*T.vol*1.8):0;
 }
}

// ---- Simulation ----
function newSim(opp){
 return {x:0,v:0,rpm:1000,gear:0,throttle:0,boost:0,t:0,started:false,
  lights:0,lightT:0,finished:false,shiftT:0,nos:0,nosT:0,pitch:0,
  opp:opp?{x:0,v:0}:null,result:'',
  stageT:0,foul:false,falseStart:false,react:null,greenAt:0,flameT:0,lcActive:false,held:true,committed:false};
}
function shift(d){
 if(!sim||sim.held)return;
 const n=sim.gear+d,max=stats().gears.length-1;
 if(n<0||n>max)return;
 if(d>0&&sim.boost>0.5)blowOff();
 sim.gear=n;sim.shiftT=0.25;
}
function useNos(){
 if(!sim)return;
 if(stats().nos<1){sim.nosMsgT=2;return}
 if(sim.nos<stats().nos&&sim.nosT<=0){sim.nos++;sim.nosT=2.5}
}
function throttleInput(){
 if(touch.id!==null&&touch.thr>0.05)return touch.thr;
 return(keys['w']||keys[' '])?1:0;
}
function step(dt){
 const s=stats(),S=sim;
 const want=throttleInput();
 if(S.held){
  // staged on the line: car held, revs follow your thumb, launch control limiter
  S.throttle+=(want-S.throttle)*Math.min(1,dt*6);
  const targetRpm=1000+S.throttle*(LAUNCH_RPM-1000);
  S.rpm+=(targetRpm-S.rpm)*Math.min(1,dt*7);
  S.lcActive=S.throttle>0.5&&S.rpm>LAUNCH_RPM-500;
  if(S.lcActive){
   S.rpm=LAUNCH_RPM-250+Math.sin(performance.now()/55)*250;
   if(Math.random()<dt*14){bang();S.flameT=0.12;crackle()}
  }
  if(S.flameT>0)S.flameT-=dt;
  const bt=s.turbo?Math.min(0.75,Math.max(0,(S.rpm-2500)/3500))*S.throttle:0;
  S.boost+=(bt-S.boost)*Math.min(1,dt*1.5);
  S.v=0;S.x=0;S.pitch+=((-0.15*S.throttle)-S.pitch)*Math.min(1,dt*4);
  return;
 }
 if(S.flameT>0)S.flameT-=dt;
 const gr=s.gears[S.gear]*3.7,wheelR=0.32;
 S.throttle+=(want-S.throttle)*Math.min(1,dt*(want>S.throttle?4:5));
 S.rpm=Math.max(1000,Math.min(7500,S.v/wheelR*gr*60/(2*Math.PI)));
 if(S.rpm>=7400&&S.throttle>0)S.rpm=7400;
 const bTarget=s.turbo?Math.max(0,(S.rpm-2500)/5000)*S.throttle:0;
 S.boost+=(bTarget-S.boost)*Math.min(1,dt*1.5);
 if(S.throttle<0.2&&S.boost>0.7&&!S.vented){blowOff();S.vented=true}
 if(S.boost<0.5)S.vented=false;
 const pk=1-Math.pow((S.rpm-5500)/5000,2);
 let power=s.hp*745.7*Math.max(0.35,pk)*S.throttle*(1+S.boost*0.35);
 if(S.nosT>0){power*=1.35;S.nosT-=dt}
 if(S.shiftT>0){power*=0.1;S.shiftT-=dt}
 const vv=Math.max(S.v,3);
 let force=power/vv;
 const gripMax=s.grip*s.mass*9.81*1.1*(0.55+0.2*Math.min(1,s.grip));
 force=Math.min(force,gripMax);
 const drag=0.5*1.2*0.32*2.2*S.v*S.v+s.mass*9.81*0.015;
 const a=(force-drag)/s.mass;
 if(S.rpm>=7400&&S.throttle>0.5)S.v+=Math.min(a,0)*dt;else S.v+=a*dt;
 S.v=Math.max(0,S.v);S.x+=S.v*dt;
 const tgt=Math.max(-0.5,Math.min(1,a/9));
 S.pitch+=(tgt-S.pitch)*Math.min(1,dt*3.5);
}
// BLOCK 3 continues below...
// ===== BLOCK 3: CAREER, RIVALS, RACE FLOW =====

const BLOCKS=[[1,3],[4,6],[7,9],[10,12],[13,15]];
function carForLevel(L){
 if(L>=16)return GOLD_ID;
 for(let i=0;i<BLOCKS.length;i++)if(L>=BLOCKS[i][0]&&L<=BLOCKS[i][1])return i;
 return 0;
}
function posInBlock(L){return L-BLOCKS[carForLevel(L)][0]}
function upCount(minLvl){let n=0;UPG.forEach(u=>{if(u!=='goldturbo'&&lvl(u)>=minLvl)n++});return n}

function meetsGate(L){
 if(carForLevel(L)!==save.car)return false;
 if(L===16)return lvl('goldturbo')>=1;
 if(L===15)return upCount(5)>=8;
 const p=posInBlock(L);
 if(p===0)return true;
 if(p===1)return lvl('engine')>=1+Math.floor(L/6)&&lvl('turbo')>=1+Math.floor(L/6);
 const k=2+Math.floor(L/5);
 return lvl('engine')>=k&&lvl('turbo')>=k&&lvl('grip')>=2+Math.floor(L/6)&&upCount(2+Math.floor(L/6))>=Math.min(8,3+Math.floor(L/3));
}
function surplus(L){
 let s=0;UPG.forEach(u=>{if(u!=='goldturbo')s+=lvl(u)});
 return s-Math.min(40,L*2);
}

// Rival cars: a different make, colour and shape for every level
const RIVALS=[
 {n:'Datsin Bluebird',col:'#c9c9c9',roof:'#999',shape:0},
 {n:'Hondo Civical',col:'#d8b020',roof:'#8a6d10',shape:0},
 {n:'Subaroo WRX',col:'#2a5fd0',roof:'#173a85',shape:0},
 {n:'Fjord Falcon',col:'#1f7a3a',roof:'#0f4a22',shape:1},
 {n:'Chevvy Camarro',col:'#e0a000',roof:'#7a5600',shape:1},
 {n:'Dodgey Charger',col:'#222',roof:'#000',shape:1},
 {n:'Mazder RX-Seven',col:'#d03030',roof:'#7a1515',shape:2},
 {n:'Mitsubitchy Evo',col:'#e8e8ee',roof:'#9a9aa5',shape:0},
 {n:'Nizzan Fairlady',col:'#6a2aa8',roof:'#3c1566',shape:2},
 {n:'Lexxus LFA',col:'#e05a10',roof:'#7a3008',shape:2},
 {n:'Porshe Nine-Eleven',col:'#a8c4d8',roof:'#5a7488',shape:2},
 {n:'Ferrarri F40',col:'#c01818',roof:'#600c0c',shape:2},
 {n:'Lambo Gallardough',col:'#9ad020',roof:'#4a6a10',shape:2},
 {n:'Bugatty Veyrong',col:'#14306a',roof:'#0a1838',shape:2},
 {n:'McLarin Senna-ish',col:'#f0f0f0',roof:'#aaa',shape:2},
 {n:'Dark Godzilla',col:'#0a0a0a',roof:'#000',shape:3}
];
function rival(){return RIVALS[Math.min(RIVALS.length-1,Math.max(0,save.level-1))]}

function stepOpp(dt){
 const S=sim,o=S.opp;
 if(!o||!S.started)return;
 const L=save.level,ok=meetsGate(L);
 const pace=Math.max(S.v,6+S.t*7);
 let k;
 if(!ok)k=1.03;
 else k=Math.max(0.90,0.985-Math.min(0.08,surplus(L)*0.004));
 o.v+=(pace*k-o.v)*Math.min(1,dt*2.2);
 o.x+=o.v*dt;
 if(ok){
  const gapBehind=0.6+Math.min(2.5,S.v*0.04);
  if(o.x>S.x-gapBehind)o.x=S.x-gapBehind;
 }else{
  const lead=1+Math.min(4,S.v*0.05);
  if(o.x<S.x+lead)o.x=S.x+lead;
 }
 if(o.x<0)o.x=0;
}

function prizeFor(L,half){return Math.round((half?1.7:1)*(900+L*420))}
function upCost(u){
 const l=lvl(u),c=CARS[save.car];
 return Math.round((700+c.price*0.035)*Math.pow(1.85,l)/50)*50;
}

function startRace(){
 destroyEngineSound();initAudio();
 sim=newSim(true);mode='race';
 document.getElementById('menu').classList.add('hide');
}
function startFree(){
 destroyEngineSound();initAudio();
 sim=newSim(false);mode='free';sim.started=true;sim.held=false;traffic=[];
 document.getElementById('menu').classList.add('hide');
}

function raceFlow(dt){
 const S=sim;
 if(mode!=='race')return;
 const L=save.level;
 if(!S.started&&!S.finished){
  S.stageT+=dt;
  const t=S.stageT-1.5;
  if(t<0)S.lights=0;
  else{
   S.lights=Math.min(3,Math.floor(t/0.7)+1);
   if(t>2.8){S.started=true;S.lights=4;S.greenAt=performance.now();S.held=false}
  }
  // false start: once the ambers begin you must keep holding the throttle
  if(S.lights>=1&&!S.started){
   if(S.throttle>0.5)S.committed=true;
   else if(S.committed){
    S.finished=true;S.win=false;S.paid=true;S.held=true;S.falseStart=true;S.doneAt=performance.now();
    S.result='FALSE START';
   }
  }
  return;
 }
 if(S.finished)return finishCheck();
 if(S.react===null){
  if(S.throttle>0.4||S.v>0.2)S.react=(performance.now()-S.greenAt)/1000;
  else if(performance.now()-S.greenAt>1500)S.react=1.5;
 }
 S.t+=dt;
 stepOpp(dt);
 if(S.x>=dist){S.finished=true;S.et=S.t;S.trap=S.v*2.237;S.win=S.opp.x<dist&&meetsGate(L);S.doneAt=performance.now()}
 else if(S.opp.x>=dist){S.finished=true;S.et=S.t;S.trap=S.v*2.237;S.win=false;S.doneAt=performance.now()}
 if(S.finished&&!S.paid){
  S.paid=true;
  const half=dist>500,full=prizeFor(L,half),rt=S.react===null?1:S.react;
  const bonus=rt<0.2?500:rt<0.35?200:0;
  if(S.win){
   const prize=full+bonus;save.cash+=prize;
   S.result='LEVEL '+L+' WON  +$'+prize+'  ET '+S.et.toFixed(2)+'s  RT '+rt.toFixed(3);
   if(L===save.level&&L<16)save.level=L+1;

 initAudio();
 if(sim&&sim.finished&&performance.now()-sim.doneAt>700&&(!sim.ending||sim.endT>8)){toMenu();return}
 if(mode!=='race'&&mode!=='free')return;
 for(const t of e.changedTouches){
  const x=t.clientX,y=t.clientY;
  if(hit(btn.up,x,y)){shift(1);continue}
  if(hit(btn.dn,x,y)){shift(-1);continue}
  if(hit(btn.nos,x,y)){useNos();continue}
  if(hit(btn.cam,x,y)){camView=(camView+1)%3;continue}
  if(hit(btn.menu,x,y)){mode==='race'&&sim&&sim.falseStart?0:0;sim=null;toMenu();return}
  if(x>cv.width*0.4&&touch.id===null){touch.id=t.identifier;touch.y0=y;touch.thr=0.3}
 }
},{passive:false});
cv.addEventListener('touchmove',e=>{
 e.preventDefault();
 for(const t of e.changedTouches){
  if(t.identifier===touch.id){
   const slide=(touch.y0-t.clientY)/(cv.height*0.4);
   touch.thr=Math.max(0.3,Math.min(1,0.3+slide));
  }
 }
},{passive:false});
function endTouch(e){for(const t of e.changedTouches)if(t.identifier===touch.id){touch.id=null;touch.thr=0}}
cv.addEventListener('touchend',endTouch);cv.addEventListener('touchcancel',endTouch);
cv.addEventListener('click',()=>{
 initAudio();
 if(sim&&sim.finished&&performance.now()-sim.doneAt>700&&(!sim.ending||sim.endT>8))toMenu();
});

// ---- Ending screen ----
function drawEnding(){
 if(!sim||!sim.ending)return;
 sim.endT+=0.016;
 const w=cv.width,h=cv.height,a=Math.min(0.92,sim.endT/3);
 g.fillStyle='rgba(0,0,0,'+a+')';g.fillRect(0,0,w,h);
 if(sim.endT<2)return;
 g.textAlign='center';g.fillStyle='#ffd24a';g.font='bold '+(h*0.07)+'px monospace';g.fillText('THANKS FOR PLAYING',w/2,h*0.2);
 g.fillStyle='#fff';g.font=(h*0.035)+'px monospace';
 const lines=['You started with a tired little Nizzan Silvana.','You tuned it, boosted it, and climbed through five cars.','You beat fifteen rivals, then the dark Godzilla,','and won the Golden Godzilla for good.','','Final ET: '+sim.et.toFixed(2)+'s   Top speed: '+sim.trap.toFixed(0)+' mph','The Golden Godzilla and Golden Turbo are yours to keep.','Head to free roam and enjoy the open road.'];
 lines.forEach((l,i)=>{if(sim.endT>2+i*0.6)g.fillText(l,w/2,h*0.32+i*h*0.06)});
 if(sim.endT>8){g.fillStyle='#0f6';g.fillText('Tap anywhere to continue',w/2,h*0.88)}
}

// ---- Menu ----
function specLine(c){return c.hp+' hp | '+c.mass+' kg | grip '+c.grip.toFixed(2)+' | '+c.gears.length+' speed | '+(c.hp/c.mass*1000).toFixed(0)+' hp per tonne'}
function toMenu(){
 if(sim&&sim.falseStart){const d=dist;sim=null;dist=d;startRace();return}
 mode='menu';sim=null;traffic=[];destroyEngineSound();
 const m=document.getElementById('menu');m.classList.remove('hide');
 const c=CARS[save.car],L=Math.min(save.level,16),need=carForLevel(L);
 let html='<h1>DRAG RACING SIM</h1><h3>Cash: $'+save.cash+'  |  Car: '+c.n+'  |  Career level: '+L+(save.done?' (COMPLETE)':'')+'</h3>';
 html+='<h3>Career race: level '+L+' vs '+RIVALS[Math.min(15,L-1)].n+'</h3>';
 if(need!==save.car)html+='<p style="color:#fa0">Level '+L+' needs the '+CARS[need].n+(save.owned.includes(need)?'. Select it in the garage.':'. Buy it in the garage first.')+'</p>';
 html+='<button onclick="dist=402;startRace()">Race quarter mile</button><button onclick="dist=805;startRace()">Race half mile</button>';
 if(save.level>1)html+='<button onclick="save.level--;store();toMenu()">Replay easier level</button>';
 html+='<h3>Free roam</h3><button onclick="startFree()">Cruise the highway</button>';
 html+='<h3>Garage</h3>';
 CARS.forEach((car,i)=>{
  if(car.gold&&!save.gold)return;
  const own=save.owned.includes(i);
  html+='<div><button onclick="buyCar('+i+')">'+car.n+(own?(save.car===i?' (driving)':' (owned, select)'):' - $'+car.price)+'</button><br><small style="color:#8cf">'+specLine(car)+'</small></div>';
 });
 html+='<h3>Upgrades for '+c.n+'</h3><small style="color:#8cf">Each car has its own upgrades.</small><br>';
 UPG.forEach(u=>{
  if(u==='goldturbo'){
   if(!save.gold||save.car!==GOLD_ID)return;
   html+='<button onclick="buyUp(\'goldturbo\')" style="border-color:gold;color:gold">Golden Turbo '+(lvl(u)>=1?'INSTALLED':'- $'+GOLD_TURBO_COST)+'</button>';
   return;
  }
  const l=lvl(u);
  html+='<button onclick="buyUp(\''+u+'\')">'+u+' L'+l+(l>=5?' MAX':' - $'+upCost(u))+'</button>';
 });
 html+='<p>Slide up on the right to accelerate. Hold the throttle at the lights for launch control. UP and DOWN shift. NOS is nitrous. VIEW changes camera. MENU leaves a race.</p>';
 m.innerHTML=html;
}
function buyCar(i){
 if(save.owned.includes(i))save.car=i;
 else if(save.cash>=CARS[i].price){save.cash-=CARS[i].price;save.owned.push(i);save.car=i}
 store();toMenu();
}
function buyUp(u){
 if(u==='goldturbo'){
  if(lvl(u)<1&&save.cash>=GOLD_TURBO_COST){save.cash-=GOLD_TURBO_COST;save.up[save.car+u]=1;store()}
  toMenu();return;
 }
 const l=lvl(u),cost=upCost(u);
 if(l<5&&save.cash>=cost){save.cash-=cost;save.up[save.car+u]=l+1;store()}
 toMenu();
}

// ---- Main loop ----
let last=performance.now();
function loop(now){
 const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(sim&&(mode==='race'||mode==='free')){
  if(mode==='free')freeRoam(dt);
  raceFlow(dt);
  step(dt);
  soundUpdate();
  drawWorld();
  if(mode==='free')drawTraffic();
  drawRival();
  drawOwnCar();
  if(camView===0)drawCockpit();
  drawEffects();
  drawTouchUI();
  drawEnding();
 }else{
  g.fillStyle='#000';g.fillRect(0,0,cv.width,cv.height);
 }
 requestAnimationFrame(loop);
}
save.owned=save.owned.filter(i=>i<CARS.length);
if(!save.owned.includes(0))save.owned.push(0);
if(save.car>=CARS.length)save.car=0;
toMenu();requestAnimationFrame(loop);
</script>
</body>
</html>
